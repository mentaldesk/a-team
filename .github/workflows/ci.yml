name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Syntax
        run: for f in scripts/*.sh bin/a-team tests/*.sh; do bash -n "$f"; done

      - name: ShellCheck
        run: shellcheck --severity=warning scripts/*.sh bin/a-team tests/*.sh

      - name: Test
        run: bash tests/scripts.sh

      - name: JSON config
        run: jq -e . settings/*.json examples/*.json >/dev/null

      - name: Workflows
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build dashboard/Dashboard.csproj -warnaserror

      - name: Test
        run: dotnet test tests/Dashboard.Tests/Dashboard.Tests.csproj -warnaserror

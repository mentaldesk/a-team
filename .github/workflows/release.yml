name: Release

# Run it from the Actions tab: it picks the next version, builds every platform, publishes the
# GitHub release and updates the Homebrew formula. On a PR it only builds, to check packaging.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to bump. "auto" reads the labels of PRs merged since the last release (breaking = major, enhancement = minor, otherwise patch).
        type: choice
        options: [auto, patch, minor, major]
        default: auto
  pull_request:
    paths:
      - .github/workflows/release*.yml
      - dashboard/**
      - packaging/**

permissions:
  contents: read

concurrency: release

jobs:
  version:
    uses: ./.github/workflows/release-version.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      bump: ${{ inputs.bump || 'auto' }}

  build:
    name: Build ${{ matrix.rid }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-14
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish dashboard
        run: >
          dotnet publish dashboard/Dashboard.csproj -c Release -r ${{ matrix.rid }}
          -p:MinVerVersionOverride=${{ needs.version.outputs.version }} -o publish

      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          stage="stage/a-team"
          mkdir -p "$stage/libexec" dist
          cp -R bin scripts roles tasks settings examples process.md README.md "$stage/"
          cp LICENSE "$stage/"
          cp publish/a-team-dashboard "$stage/libexec/"
          echo "$VERSION" > "$stage/VERSION"
          archive="a-team-$VERSION-$RID.tar.gz"
          tar -czf "dist/$archive" -C stage a-team
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          "$stage/bin/a-team" version

      - uses: actions/upload-artifact@v4
        with:
          name: a-team-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/release-publish.yml
    permissions:
      contents: write
    with:
      name: a-team
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
      formula: packaging/a-team.rb
      artifacts: a-team-*
    secrets:
      packages-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

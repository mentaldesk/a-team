name: Release publish

# Reusable: tags the commit, publishes the GitHub release from the caller's build artifacts, opens
# a Homebrew tap PR with the rendered formula, and, for a caller that passes a Scoop manifest
# template or turns on apt, commits those to its bucket and its apt repository in the same run.
# See AGENTS.md, "Releasing".
on:
  workflow_call:
    inputs:
      name:
        description: Package name. Archives are named <name>-<version>-<rid>.tar.gz or .zip.
        type: string
        required: true
      version:
        description: Version to release, without a leading "v".
        type: string
        required: true
      tag:
        description: Tag to create, e.g. v1.2.3.
        type: string
        required: true
      formula:
        description: Homebrew formula template in the calling repo, e.g. packaging/a-team.rb.
        type: string
        required: true
      tap:
        description: Homebrew tap repository the formula PR is opened against.
        type: string
        default: mentaldesk/homebrew-tap
      scoop:
        description: Scoop manifest template in the calling repo, e.g. packaging/tuicode.json. Omit it and no Scoop step runs.
        type: string
        default: ''
      bucket:
        description: Scoop bucket repository the manifest is committed to.
        type: string
        default: mentaldesk/scoop-bucket
      apt:
        description: Publish the caller's <name>_<version>_<arch>.deb artifacts to apt-repo, signed with APT_GPG_PRIVATE_KEY. Off, no apt step runs.
        type: boolean
        default: false
      apt-repo:
        description: Repository served on GitHub Pages as the signed apt repository. The release replaces its own package there and keeps the others.
        type: string
        default: mentaldesk/apt
      artifacts:
        description: Pattern matching the caller's uploaded build artifacts.
        type: string
        default: '*'
      environment:
        description: Environment in the calling repo the job runs in. Its PACKAGES_TOKEN secret is used in place of packages-token, so only the branches it allows can reach the token.
        type: string
        default: ''
    secrets:
      packages-token:
        description: Token with contents and pull-requests write on the tap, and contents write on the bucket and apt-repo. Without it the release still publishes and the packaging steps warn.
        required: false
      PACKAGES_TOKEN:
        description: 'The same token, from the environment named by `environment`. It only resolves when the caller passes `secrets: inherit`.'
        required: false
      APT_GPG_PRIVATE_KEY:
        description: ASCII-armoured private key that signs apt-repo. Every caller publishing to the same apt-repo must use the same key, since users trust the one key.asc it serves.
        required: false
      APT_GPG_PASSPHRASE:
        description: Passphrase for APT_GPG_PRIVATE_KEY.
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: ${{ inputs.artifacts }}
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes

      - name: Render templates
        env:
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
          FORMULA: ${{ inputs.formula }}
          SCOOP: ${{ inputs.scoop }}
        run: |
          shopt -s nullglob
          script="s/{{version}}/$VERSION/g"
          for archive in "dist/$NAME-$VERSION-"*.tar.gz "dist/$NAME-$VERSION-"*.zip; do
            rid=${archive##*/}
            rid=${rid#"$NAME-$VERSION-"}
            rid=${rid%.tar.gz}
            rid=${rid%.zip}
            sha=$(shasum -a 256 "$archive" | cut -d' ' -f1)
            script="$script;s/{{sha_${rid//-/_}}}/$sha/g"
            echo "$rid $sha"
          done
          render() {
            sed -e "$script" "$1" > "$2"
            cat "$2"
            left=$(grep -o '{{[^}]*}}' "$2" | sort -u | tr '\n' ' ') || true
            if [ -n "$left" ]; then
              echo "::error::$1 still has unfilled placeholders: $left. No artifact matched them."
              exit 1
            fi
          }
          render "$FORMULA" formula.rb
          if [ -n "$SCOOP" ]; then render "$SCOOP" scoop.json; fi

      - name: Check for the packages token
        id: tap
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.packages-token }}
          SCOOP: ${{ inputs.scoop }}
          APT: ${{ inputs.apt }}
        run: |
          what="the formula"
          if [ -n "$SCOOP" ]; then what="$what, the Scoop manifest"; fi
          if [ "$APT" = true ]; then what="$what, the apt repository"; fi
          if [ -n "$TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::No packages token, so these weren't updated: $what. Set PACKAGES_TOKEN in the environment this job runs in, or the secret your release workflow passes as packages-token, then re-run this job."; fi

      - uses: actions/checkout@v7
        if: steps.tap.outputs.ok == 'true'
        with:
          repository: ${{ inputs.tap }}
          token: ${{ secrets.PACKAGES_TOKEN || secrets.packages-token }}
          path: tap

      - name: Open tap PR
        if: steps.tap.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.packages-token }}
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag }}
        run: |
          mkdir -p tap/Formula
          cp formula.rb "tap/Formula/$NAME.rb"
          cd tap
          base=$(git rev-parse --abbrev-ref HEAD)
          if git diff --quiet -- "Formula/$NAME.rb" && git ls-files --error-unmatch "Formula/$NAME.rb" >/dev/null 2>&1; then
            echo "Formula already at $VERSION"
            exit 0
          fi
          branch="$NAME-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "Formula/$NAME.rb"
          git commit -m "$NAME $VERSION"
          git push --force-with-lease -u origin "$branch"
          body="Updates \`$NAME\` to $VERSION. Release: $RELEASE_URL"
          gh pr view "$branch" >/dev/null 2>&1 || gh pr create --base "$base" --head "$branch" --title "$NAME $VERSION" --body "$body"
          # The tap's own CI (brew audit, install and test on every platform) gates the merge.
          if ! gh pr merge "$branch" --auto --squash --delete-branch; then
            echo "::warning::Auto-merge isn't available on the tap, so the formula PR needs merging by hand once its checks pass: $(gh pr view "$branch" --json url --jq .url)"
          fi
          url=$(gh pr view "$branch" --json url --jq .url)
          # An older release's formula PR still open can only conflict with this one now.
          gh pr list --state open --limit 100 --json number,headRefName --jq '.[] | "\(.number) \(.headRefName)"' |
            while read -r number head; do
              old=${head#"$NAME-"}
              [[ $head == "$NAME-$old" && $old =~ ^[0-9]+(\.[0-9]+)*$ && $old != "$VERSION" ]] || continue
              [ "$(printf '%s\n' "$old" "$VERSION" | sort -V | head -1)" = "$old" ] || continue
              gh pr close "$number" --delete-branch --comment "Superseded by $NAME $VERSION: $url"
            done

      - uses: actions/checkout@v7
        if: inputs.scoop != '' && steps.tap.outputs.ok == 'true'
        with:
          repository: ${{ inputs.bucket }}
          token: ${{ secrets.PACKAGES_TOKEN || secrets.packages-token }}
          path: scoop-bucket

      - name: Commit Scoop manifest
        if: inputs.scoop != '' && steps.tap.outputs.ok == 'true'
        env:
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          manifest="bucket/$NAME.json"
          mkdir -p scoop-bucket/bucket
          cp scoop.json "scoop-bucket/$manifest"
          cd scoop-bucket
          if git diff --quiet -- "$manifest" && git ls-files --error-unmatch "$manifest" >/dev/null 2>&1; then
            echo "Manifest already at $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$manifest"
          git commit -m "$NAME $VERSION"
          # The bucket has no CI to gate a PR, so this is a commit on its default branch.
          git push

      - name: Check for the apt signing key
        id: apt
        if: inputs.apt && steps.tap.outputs.ok == 'true'
        env:
          KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          shopt -s nullglob
          debs=(dist/"${NAME}_${VERSION}"_*.deb)
          if [ ${#debs[@]} -eq 0 ]; then
            echo "::error::apt is on, but no artifact is named ${NAME}_${VERSION}_<arch>.deb."
            exit 1
          fi
          if [ -n "$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::No APT_GPG_PRIVATE_KEY, so the apt repository wasn't updated. Set it and APT_GPG_PASSPHRASE in the environment this job runs in, then re-run this job."; fi

      - uses: actions/checkout@v7
        if: steps.apt.outputs.ok == 'true'
        with:
          repository: ${{ inputs.apt-repo }}
          token: ${{ secrets.PACKAGES_TOKEN || secrets.packages-token }}
          path: apt-repo

      - name: Publish apt repository
        if: steps.apt.outputs.ok == 'true'
        env:
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
          ORIGIN: ${{ github.repository_owner }}
          GPG_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          command -v apt-ftparchive >/dev/null || sudo apt-get install -y -qq apt-utils
          cd apt-repo
          pool="pool/main/$NAME"
          mkdir -p "$pool"
          rm -f "$pool"/*.deb
          cp ../dist/"${NAME}_${VERSION}"_*.deb "$pool/"
          arches=$(for deb in pool/main/*/*.deb; do dpkg-deb -f "$deb" Architecture; done | grep -vx all | sort -u | tr '\n' ' ')
          rm -rf dists
          for arch in $arches; do
            dir="dists/stable/main/binary-$arch"
            mkdir -p "$dir"
            apt-ftparchive --arch "$arch" packages pool > "$dir/Packages"
            gzip -9kn "$dir/Packages"
          done
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="$ORIGIN" -o APT::FTPArchive::Release::Label="$ORIGIN" \
            -o APT::FTPArchive::Release::Suite=stable -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Components=main -o APT::FTPArchive::Release::Architectures="${arches% }" \
            release dists/stable > "$RUNNER_TEMP/Release"
          mv "$RUNNER_TEMP/Release" dists/stable/Release

          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          sign() { gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 "$@" 3<<<"$GPG_PASSPHRASE"; }
          sign --clearsign -o dists/stable/InRelease dists/stable/Release
          sign --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release
          gpg --armor --export > key.asc
          touch .nojekyll

          branch=$(git rev-parse --abbrev-ref HEAD)
          old=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # One orphan commit, so the repo holds only the current packages rather than every release's.
          git checkout -q --orphan publish
          git add -A
          git commit -qm "$NAME $VERSION"
          git push --force-with-lease="$branch:$old" origin "HEAD:$branch"
